[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "racing-sync"
version = "0.1.0"
description = "Sync racing torrents from a fast VPS to a long-term seed VPS with rclone offload"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kevin" }]
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.9,<4",
    "pydantic>=2.5,<3",
    "python-telegram-bot>=22.0,<23",
    "paramiko>=3.4,<6",
    "defusedxml>=0.7",
    # Faster asyncio loop on Linux (VPS); Windows/macOS fall back to
    # stdlib via _run_async. Pinned out of test scope (no uvloop there).
    "uvloop>=0.21; sys_platform == 'linux'",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.0,<5",
    "respx>=0.21",
    "httpx>=0.27",
]

[project.scripts]
racing-sync = "racing_sync.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
racing_sync = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# ASYNC240 flags every pathlib call inside an async function, and cannot
# tell a single exists()/resolve() syscall from a recursive walk. The
# heavy filesystem work here already runs on a thread (offload/rpc,
# asyncio.to_thread); the remaining hits are one syscall on a local path.
ignore = ["E501", "ASYNC240"]

[tool.ruff.lint.isort]
# Keep `from x import (a as _a, b as _b)` in one statement — the module
# re-export guards rely on that grouping to stay readable.
combine-as-imports = true