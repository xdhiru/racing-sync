[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "racing-sync"
version = "0.1.0"
description = "Sync racing torrents from a fast VPS to a long-term seed VPS with rclone offload"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kevin" }]
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.9",
    "pydantic>=2.5",
    "python-telegram-bot>=22.0",
    "paramiko>=3.4",
    "qrcode>=7.4",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "httpx>=0.27",
]

[project.scripts]
racing-sync = "racing_sync.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
racing_sync = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]