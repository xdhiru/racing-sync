# ============================================================
# racing-sync configuration
# ============================================================

[general]
# Polling interval (seconds) for source client (VPS1)
source_poll_interval = 60
# Polling interval (seconds) for destination client (VPS2)
dest_poll_interval = 30
# SQLite state DB path
state_db = "/var/lib/racing-sync/state.db"
# Log directory (rotating files)
log_dir = "/var/log/racing-sync"
# Log retention days
log_retention_days = 2

# Safety margin added on top of every SSD free-space check (bytes).
# Example: 1 GiB. Prevents races between disk_usage() check and torrent fill.
disk_safety_margin_bytes = 1073741824

# Optional global overrides (all commented = use per-section values):
#   max_active_downloads       overrides [dest].max_active_downloads
#   max_concurrent_moves       overrides [rclone].max_concurrent_moves
# max_active_downloads = 3
# max_concurrent_moves = 3
# Stall timeout (seconds) for a VPS2 SSD download with zero progress.
# 0 = disabled (default); set e.g. 3600 to park visibly-stuck downloads
# back in DOWNLOADING for retry instead of failing them.
# download_stall_timeout_seconds = 0

# ============================================================
# Source (VPS1) — racing client
# ============================================================

[source]
# Type of client: "qbittorrent" or "deluge"
type = "qbittorrent"

# --- WebUI connection ---
host = "http://127.0.0.1:8080"
username = "admin"
password = "change_me"
# Network family for the WebUI session. false (default) forces IPv4 —
# intentional: tracker allowlists, split-horizon DNS and jail/VPN egress on
# seedboxes are overwhelmingly v4. Set true only for v6-capable setups.
# use_ipv6 = false
# Filter racing torrents by category/label. Empty string = sync ALL
# torrents regardless of category (recommended when the racing client
# doesn't categorise its torrents, e.g. it just races everything).
#
# Examples:
#   category = ""           # sync every torrent
#   category = "racing"     # only sync torrents in category "racing"
#   category = "auto,manual"  # qBittorrent supports comma-separated names
category = ""

# Only sync torrents added on the racing client at least N seconds ago.
# Gives cross-seeds / secondary private trackers time to be added to the racing
# client before sync and re-injection begin.
# 0 = sync immediately without waiting (default).
min_age_seconds = 0

# Optional: nginx (or other reverse-proxy) auth in front of the WebUI.
# Two modes:
#
#   mode = "basic"   (default, most common)
#     The proxy uses HTTP Basic auth (`auth_basic` directive in nginx).
#     The client sends `Authorization: Basic ...` on every request
#     using the credentials from [source].username and [source].password.
#     This is the popup your browser shows when you visit the WebUI.
#     `url` is ignored.
#
#   mode = "form_post"  (unusual)
#     The proxy returns a custom HTML login form on 401 (custom nginx
#     `auth_request` flow). The client POSTs to `url` to obtain a
#     session cookie, then proceeds with the WebUI's own login.
#     `user_field` / `pass_field` are the HTML form's field NAMES.
#
#   mode = "off"  (no proxy auth)
#     WebUI is reachable directly.
#
# For typical nginx `auth_basic` setups (which is what most people
# use), you don't need to set anything here other than leaving the
# defaults — credentials come from [source].username / password.
[source.nginx]
mode         = "off"
url          = ""           # only used when mode="form_post"
user_field   = "username"   # only used when mode="form_post"
pass_field   = "password"   # only used when mode="form_post"
extra_fields = {}          # only used when mode="form_post"

# --- Deluge-only: SFTP export of .torrent files from state dir ---
[source.deluge_sftp]
enabled = false
ssh_host = "127.0.0.1"
ssh_port = 22
ssh_user = "deluge"
# Authentication priority: ssh_key_path (with optional passphrase)
# takes precedence over ssh_password. At least one must be set.
#
# Plain-password auth (used when ssh_key_path is empty):
ssh_password = ""
# Public-key auth:
ssh_key_path = ""
# Passphrase for the SSH key above. Leave empty for an unencrypted key.
ssh_key_passphrase = ""
# Host-key verification for the SSH connection.
#   known_hosts_path   file with the VPS1 host key (e.g. "~/.ssh/known_hosts").
#                      Empty = use the system host keys.
#   auto_add_host_key  true = trust the host key on first connect (weaker:
#                      vulnerable to first-connection MITM). Needed when the
#                      host is not in known_hosts, otherwise startup fails with
#                      "Server ... not found in known_hosts".
#                      Pin via `ssh-keyscan -p <ssh_port> <ssh_host>` instead.
known_hosts_path = ""
auto_add_host_key = false
# Path inside VPS1 to deluge state dir; typically ~/.config/deluge/state
state_dir = "/home/deluge/.config/deluge/state"
# Independent SSH/SFTP connections in the exporter pool (1-8, default 3).
# Concurrent re-inject fetches share the pool instead of serializing on
# one transport; a wedged member fails over instead of wedging everyone.
pool_size = 3

# ============================================================
# Destination (VPS2) — long-term seed client (qbittorrent)
# ============================================================

[dest]
host = "http://127.0.0.1:8080"
username = "admin"
password = "change_me"

# Default save_path used for movies / season-root folders.
# This MUST be on the local SSD (not the fuse mount) so qBittorrent
# can hash-check normally.
save_path = "/srv/qbittorrent/data"

# Maximum concurrent torrents actively downloading on VPS2 SSD (default: 3).
# Limits additions to qBittorrent on SSD so disk I/O and network aren't overloaded.
max_active_downloads = 3
# Network family for the WebUI session (see [source].use_ipv6).
# use_ipv6 = false

# Optional nginx basic-auth in front of the qBittorrent WebUI on VPS2.
# Optional nginx auth in front of the qBittorrent WebUI on VPS2.
# Same semantics as [source.nginx]. mode="basic" is the common case
# (HTTP Basic auth via the Authorization header).
[dest.nginx]
mode         = "off"        # VPS2 typically has no nginx
url          = ""
user_field   = "username"
pass_field   = "password"
extra_fields = {}

# ============================================================
# SSD cap (VPS2 local storage)
# ============================================================

[ssd]
# Path to check free space against (usually == dest.save_path)
path = "/srv/qbittorrent/data"
# GLOBAL budget (bytes) shared by every concurrent download — not a
# per-torrent cap. Each torrent reserves min(total, this) before admission
# and parks in WAITING_DISK past it; batch footprints refine after
# classification. Keep this below the filesystem size minus headroom.
max_inflight_bytes = 42949672960   # 40 GiB
# If a single-file torrent (movie) is larger than this, skip it entirely.
# (Season torrents are still processed in batches even if larger.)
skip_movie_larger_than_bytes = 42949672960  # 40 GiB
# Extra per-check safety margin for SSD operations (bytes, default 0).
# Adds to [general].disk_safety_margin_bytes for SSD-space decisions.
safety_margin_bytes = 0

# ============================================================
# rclone (VPS2)
# ============================================================

[rclone]
# Absolute path to the rclone binary (defaults to /usr/local/bin/rclone)
binary = "/usr/local/bin/rclone"
# Optional: path to a specific rclone.conf file. If omitted or left empty,
# rclone uses the default user config (~/.config/rclone/rclone.conf).
# Useful if you want a dedicated, separate rclone.conf for this app.
# config_path = "/path/to/rclone.conf"
# Maximum concurrent rclone move commands running simultaneously (default: 3).
# Limits parallel moves from SSD to remote to prevent CPU/network saturation.
# Can be overridden globally via [general].max_concurrent_moves.
max_concurrent_moves = 3
# Wall-clock ceiling per `rclone move` in seconds (default: 21600 / 6h).
# A remote that stops responding (e.g. API flood-waits on Telegram-backed
# remotes with high --transfers) parks the row for retry instead of wedging
# a move slot forever. Timeouts never fail the row (bytes stay on SSD).
# Lower it on fast remotes (e.g. 1800) so stalls surface sooner.
# move_timeout_seconds = 21600
# Optional override for the fuse re-inject delay below (seconds).
# Empty/unset = use [rclone.fuse].reinject_delay_seconds.
# reinject_delay_seconds = 30

# Extra rclone flags applied to every `rclone move`.
# Defaults are sensible for slow remotes; tune as needed.
extra_move_flags = [
    "--transfers=4",
    "--checkers=8",
    "--bwlimit=0",          # 0 = no limit; set a number if you need to cap
    "--size-only",          # faster than --checksum on huge media files
    "--retries=10",
    "--low-level-retries=20",
    "--log-level=INFO",
    "--stats=30s",
    "--stats-one-line",
]

# rclone move used for the per-batch episode transfers adds
# --include patterns dynamically. These extra flags are appended
# AFTER the auto-generated --include flags so they can still win
# if needed.
batch_move_extra_flags = [
    "--delete-after",       # not strictly needed; batch folder is wiped locally anyway
]

# Default remote + path for movies and full season-root folders.
# These are rclone REMOTE paths (not fuse mount paths).
# They get passed to:   rclone move <local> <remote_path>
[rclone.remote]
# e.g. "remote:qbittorrent/"
default = "remote:qbittorrent/"
# Subfolder for individual TV episodes that are not part of a
# completed full-season move (req #6, #8).
unsorted = "remote:qbittorrent/unsorted/"

# Fuse mount paths on the destination client.
# These are what qBittorrent uses as save_path AFTER files have been
# moved to the remote and we want to seed from the mount.
[rclone.fuse]
# Mount for movies + season roots
mount = "/mnt/remote/qbittorrent"
# Mount for individual episodes
mount_unsorted = "/mnt/remote/qbittorrent/unsorted"
# Delay (seconds) before re-injecting torrents to fuse after rclone move (default: 30).
# Allows cloud fuse mounts time to refresh directory caches and index the new files.
reinject_delay_seconds = 135

# Gap (seconds) between immediate re-injection retries when destination WebUI is unresponsive (default: 120 / 2 minutes).
# Allows transient disk I/O and network transfer spikes time to subside before re-attempting.
reinject_retry_gap_seconds = 120

# Backoff interval (seconds) when destination WebUI remains unresponsive after immediate retries (default: 1800 / 30 minutes).
# Avoids hammering the WebUI under heavy load, waiting 30 minutes between retry cycles.
reinject_backoff_seconds = 1800

# Maximum duration (seconds) since re-injection began before marking the torrent as FAILED (default: 86400 / 24 hours).
# Prevents dangling tasks while giving slow/overloaded servers ample time to recover.
reinject_max_age_seconds = 86400

# ============================================================
# Classifier (movie / episode / season)
# ============================================================

[classifier]
# Regex applied to a FILE NAME (not folder). If it matches, the file
# is treated as an individual TV episode and routed to unsorted/.
# Default: S01E03, s10e22, S1E1, S36E171, etc. The episode number allows
# up to 3 digits for long-running daily shows (S36E171, S62E010, ...).
# Tweak per your release naming.
episode_regex = "(?i)\\bS\\d{1,2}E\\d{1,3}\\b"

# ============================================================
# Telegram notifications
# ============================================================

[telegram]
# Telegram layout:
#   - one message per torrent (detail card, edited in place as state
#     advances, persists in chat as history)
#   - one pinned message at the bottom of the chat (active tasks list,
#     edited every status_update_interval seconds)
#
# App logging goes to local files only — there is no log forwarding
# to Telegram.
enabled = false
bot_token = ""
chat_id = ""
# How often to edit the active-tasks list (seconds).
status_update_interval = 15
# Number of active tasks displayed per page in the status message (default: 5).
# Users can paginate through tasks with inline arrow buttons on the message.
page_size = 5
# Pin the active-tasks message so it stays at the bottom of the channel.
pin_status_message = false
# Re-post (delete + silently resend, no notification buzz) the active-tasks
# message so it returns to newest-message position after our own traffic
# (per-torrent cards) buries it. Fires at most every N seconds, and never
# while the message is already last — no churn. 0 = disabled (edit in
# place). Minimum effective value is 5 (lower values are clamped) to respect
# Telegram rate limits. Start with 10.
active_repost_interval_seconds = 15
# Pinning the active-tasks message in the chat requires the bot to
# have admin rights with "can_pin_messages". If you don't have those,
# the bot will log a warning and continue without pinning. Most users
# don't need pinning — the active-tasks message stays at the bottom
# of the chat naturally because new per-torrent messages are sent
# above it.
# Outbound rate limit (messages/second) for per-torrent detail messages.
# Prevents Telegram HTTP 429 on bursts (e.g. first run with many torrents).
outbound_rate = 5

# ============================================================
# Centralized logging (HTTP sink)
# ============================================================

[logging_sink]
# Optional: POST structured log events to a central collector.
# Useful when source (VPS1) and destination (VPS2) both run the
# app and you want one log stream.
enabled = false
url = ""                    # e.g. "https://logs.example.com/ingest"
auth_token = ""
# Event levels to forward: "DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"
forward_min_level = "INFO"

# ============================================================
# Watch directory (VPS2) — manual private torrent drops
# req #3
# ============================================================

[watch_dir]
path = "/srv/qbittorrent/watch"
glob = "*.torrent"
delete_after_pickup = true
query_prowlarr = true
# If prowlarr returns a hit on the configured indexer, prefer that
# torrent over the manually-dropped file.
prefer_prowlarr_result = true

# ============================================================
# Prowlarr — cross-seed lookups + indexer queries
# req #5 + #6
# ============================================================

[prowlarr]
enabled = false
base_url = "http://127.0.0.1:9696"
api_key = "CHANGE_ME"
# SSD download-target indexers used for SSD downloads and cross-seed
# searches, in priority order (first table = tried first; each is queried
# in turn until one returns the exact release). `name` must match the
# EXACT indexer name in your Prowlarr instance (case-sensitive).
# `announce_substrings` identifies torrents that already come from that
# indexer (announce URL substring match), so they are used directly
# instead of being re-searched. Add one table per indexer; a single
# indexer is fine.
[[prowlarr.download_indexers]]
name = "My Indexer (API)"
announce_substrings = ["my-indexer"]
# Example second indexer (commented out):
# [[prowlarr.download_indexers]]
# name = "Another Indexer (API)"
# announce_substrings = ["another"]
# Substrings in release titles to skip querying Prowlarr for (case-insensitive).
# Useful for groups (like DummySub) whose complex titles/symbols never match Prowlarr indexers.
skip_query_substrings = ["dummysub"]
timeout_seconds = 30.0
max_results = 20
# Network family for the Prowlarr session (see [source].use_ipv6).
# use_ipv6 = false

# Tracker announce URL substring → prowlarr indexer name.
# Used to figure out which prowlarr indexer to search when a torrent
# from the racing client has only private sources.
#
# Fully user-defined. List every mapping you want. The racing client
# announce URL is checked against each key (case-insensitive substring
# match); the first match wins. The value is the prowlarr indexer name
# to search on.
#
# Examples — replace with whatever trackers YOU actually race on:
[prowlarr.tracker_map]
"alpha.cc"      = "Alpha (API)"
"beta"      = "Beta"
"gamma.tv"  = "Gamma"

# ============================================================
# Cross-seed strategy
# req #1 + #2
# ============================================================

[cross_seed]
# Policy summary (req #1 + #2):
#   Public racing torrent exists on VPS1:
#     SSD download   = use VPS1's existing public .torrent directly.
#                     Prowlarr is NOT queried in this case.
#     Re-injection   = every racing-client torrent (public + private) for
#                     this content gets re-added on VPS2 fuse, skip_check.
#   Only private racing torrents exist:
#     SSD download   = query Prowlarr download-target indexers (in
#                     priority order, first exact release wins). Park + retry
#                     per prowlarr_retry_* if no hit.
#     Re-injection   = every racing-client torrent for this content gets
#                     re-added on VPS2 fuse, skip_check.
#
# Flags below override these defaults.

# When the racing client's public .torrent is unreachable on VPS1
# (rare; e.g. BT_backup file deleted), fall back to Prowlarr for a
# public cross-seed. Default false because racing-public is preferred.
refetch_public_via_prowlarr = false
# After rclone move, re-add every racing-client torrent (public + private)
# for the content onto VPS2 fuse mount with skip_check=true.
inject_racing_torrents_to_fuse = true
# Whether to allow Prowlarr cross-seed lookups for the SSD download.
# Disable this if you want VPS2 to always leech from VPS1 directly.
allow_prowlarr_cross_seed = true
# Whether to allow SFTP / SSH-export of the racing client's .torrent
# state. Required for Deluge (no WebUI export). For qBittorrent this is
# a last-resort fallback when no public torrent and no Prowlarr hit.
allow_ssh_export = true
# Pause public torrents after fuse injection instead of seeding them.
# true (default) = public entries are added paused on the fuse mount
# (already-seeding ones are paused in place). Private torrents never pause.
# Set false to keep seeding publics from fuse.
pause_public_torrents_on_fuse = true
# req #2 follow-up: when no configured download-target indexer returns a
# cross-seed for a brand-new release, re-query every
# prowlarr_retry_interval_seconds. After prowlarr_max_age_seconds
# (counted from the FIRST attempt), give up and mark the torrent FAILED
# for manual handling — unless fallback_to_racing_torrent_on_prowlarr_timeout
# below is true.
prowlarr_retry_interval_seconds = 1800   # 30 minutes
prowlarr_max_age_seconds        = 86400  # 24 hours
# When true, a private torrent with no Prowlarr hit after prowlarr_max_age_seconds
# uses the racing client's own .torrent for the SSD download instead of FAILED.
# The fallback opens a fresh retry window for the direct attempts (a single
# SFTP blip at the deadline must not fail the row), then FAILEDs if VPS1 stays
# unreachable. VPS2 then leeches the private swarm, which counts toward ratio —
# opt in deliberately. Default false. Requires allow_ssh_export = true.
# Independent of this flag, Telegram /fetch_<hash> triggers the same fallback
# on demand for a torrent still waiting for the download indexer.
fallback_to_racing_torrent_on_prowlarr_timeout = false

# ============================================================
# Recovery / reconciliation
# req #4
# ============================================================

[recovery]
run_on_startup = true
auto_fix_state = true
batch_size = 50
# Reset previously-FAILED rows back to NEW on startup so they get another
# chance with the current code (e.g. after an upgrade that fixes the cause).
# Set false if FAILED rows should stay failed for manual intervention.
auto_retry_failed = true
# Maximum times a FAILED row is auto-retried before being left FAILED,
# guarding against infinite failure loops.
max_failed_retries = 3

# ============================================================
# VPS1 cleanup — reclaim racing-client disk after VPS2 owns it
# ============================================================

[cleanup]
# Master switch. Destructive — opt in deliberately, and run with
# dry_run = true first to review "would delete" lines in the log.
enabled = false
# Log candidates without deleting anything.
dry_run = true
# Grace bounds (hours) after VPS2 marks a row DONE. The janitor
# interpolates between them from live pressure (see below), so full
# autobrr days clear in ~min_grace and quiet days seed up to max_grace.
min_grace_hours = 2
max_grace_hours = 72
# VPS1 free-space watermarks (bytes). At/below low -> min grace and
# biggest-first ordering; at/above high -> max grace, oldest-first.
# Calibrate to the VPS1 disk (example: 80 GiB disk -> 15/40 GiB).
low_watermark_free_bytes = 16106127360    # 15 GiB
high_watermark_free_bytes = 42949672960   # 40 GiB
# Below this, log loudly; grace stays floored at min (never zero).
critical_watermark_free_bytes = 8589934592  # 8 GiB
# Intake-velocity bounds (new racing releases/hour, rolling). At/above
# burst -> min grace (spam-uploader dumps); at/below calm -> no effect.
burst_arrivals_per_hour = 8
calm_arrivals_per_hour = 2
# A race counts as finished after this many minutes with ~zero upload
# AND zero leechers. Verified-idle rows skip the grace wait (fast lane).
idle_confirm_minutes = 45
# Upload rate at/below this (B/s) counts as quiet for idle detection.
activity_upspeed_bps = 65536
# Optional H&R minimums, checked on every group member (0 = disabled).
# Only enable with per-account needs; both clients must seed the SAME
# tracker account for VPS2's fuse seeding to keep it compliant.
min_ratio = 0.0
min_seed_hours = 0.0
# Case-insensitive substrings; matching releases are never deleted.
protected_patterns = []
# Remove data files as well as client entries (required to free disk).
delete_files = true
# Max content groups deleted per janitor run + seconds between runs.
per_run_cap = 10
janitor_interval_seconds = 3600

# ============================================================
# Control API (optional, FastAPI)
# ============================================================

[api]
enabled = false
host = "127.0.0.1"
port = 8765
# When using a reverse proxy (e.g. nginx with auth_basic), you can enable
# trust_nginx_header to trust X-Authenticated-User from trusted_proxies.
# SECURITY REQUIREMENT:
# Nginx MUST overwrite (never forward) X-Authenticated-User from the client:
#   proxy_set_header X-Authenticated-User $remote_user;
# Otherwise, untrusted clients can spoof the header and bypass authentication.
trust_nginx_header = false
trusted_proxies = ["127.0.0.1", "::1", "localhost"]
# API token for direct authentication (required if trust_nginx_header is false):
api_token = "generate_a_random_token_here"